name: ci

on:
  push:
    branches: [main, integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The package is restricted on GitHub Packages; the secret must grant read:packages.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN }}" >> .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # CI is set, so a failed clone of the public starter fails the job.
      - run: pnpm check:starter
      # Typechecks every code block, writes static/verified.json, then builds the site.
      - run: pnpm build
